<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>View Request</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
        <style>
            h1 {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="btn-container mt-2">
            <a href="{{url_for('home')}}" class="btn btn-primary float-right"
                >Back to Home</a
            >
        </div>
        
        <div class="container">
            <h1 class="mt-5">View Request</h1>
        </div>

        <div class="container d-flex flex-column align-items-center">
            {{for r in result}}
            <div class="row mt-3">
                <div class="col">{{r[0]}}</div>
            </div>
            <div class="row mt-3">
                <div class="col">{{r[1]}}</div>
            </div>
            <div class="row mt-3">
                <div class="col">{{r[2]}}</div>
            </div>
            <div class="row mt-3">
                <div class="col">{{r[3]}}</div>
            </div>
            <div class="row mt-3">
                <div class="col">{{r[4]}}</div>
            </div>
            <div class="row mt-3">
                <div class="col">{{r[5]}}</div>
            </div>
            <div class="row mt-3">
                <div class="col">{{r[6]}}</div>
            </div>
            <div class="row mt-3">
                <div class="col">{{r[7]}}</div>
            </div>
            <div class="row mt-3">
                <a href="/ViewReq" class="btn btn-primary">Return to View Requests</a>
            </div>
            </table>
        </div>
    </body>
</html>
