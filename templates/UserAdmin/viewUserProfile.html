<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Details</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-top: 40px;
            text-align: center;
        }

        .profile-details {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 600px;
            margin-top: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        strong {
            display: inline-block;
            width: 100px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-custom-primary {
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            padding: 6px 12px;
            font-size: 14px;
            border: none;
            transition: 0.3s;
        }

        .btn-custom-primary:hover {
            background-color: #0056b3;
            color: white;
        }

        .btn-custom-danger {
            background-color: #dc3545;
            color: white;
            border-radius: 5px;
            padding: 6px 12px;
            font-size: 14px;
            border: none;
            transition: 0.3s;
        }

        .btn-custom-danger:hover {
            background-color: #b02a37;
            color: white;
        }

        .not-found {
            text-align: center;
            margin-top: 50px;
            color: #666;
            font-style: italic;
        }

        .link-container {
            margin-top: 20px;
            text-align: center;
        }

        .link-container a {
            display: inline-block;
            margin: 5px 0;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .link-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Profile Details</h1>

    {% if profile %}
        <div class="profile-details">
            <ul>
                <li><strong>Profile:</strong> {{ profile['profile'] }}</li>
                <li><strong>Description:</strong> {{ profile['description'] }}</li>
                <li><strong>Status:</strong> {{ profile['profileState'] }}</li>
            </ul>

            <!-- Buttons centered at the bottom of the card -->
            <div class="button-container">
                <a class="btn-custom-primary" href="{{ url_for('updateProfile', profile=profile['profile']) }}">Update Profile</a>
                <a class="btn-custom-danger" href="{{ url_for('suspendProfile', profile=profile['profile']) }}">Suspend Profile</a>
            </div>
        </div>
    {% else %}
        <p class="not-found">Profile not found.</p>
    {% endif %}

    <!-- Back and Main links -->
    <div class="link-container">
        <a href="{{ url_for('listProfiles') }}">← Back to All Profiles</a><br>
        <a href="/adminHome">Main Page</a>
    </div>
</body>
</html>
