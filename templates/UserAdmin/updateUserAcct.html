<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update User Account</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            color: #333;
            margin-top: 40px;
            text-align: center;
        }

        .update-card {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 600px;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 6px 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn-custom-primary {
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            padding: 12px 24px; /* increased padding */
            font-size: 16px;    /* increased font size */
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: block;
            margin: 20px auto 0 auto;
            min-width: 200px;   /* optional: ensures minimum width */
        }

        .btn-custom-primary:hover {
            background-color: #0056b3;
            color: white;
        }

        .form-message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .link-container {
            margin-top: 20px;
            text-align: center;
        }

        .link-container a {
            display: inline-block;
            margin: 5px 0;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .link-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>Update User Account</h2>

    <div class="update-card">
        {% if message %}
            <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
                <p>{{ message }}</p>
            </div>
        {% endif %}

        <form action="{{ url_for('updateAcct', userID=user.userID) }}" method="POST">
            <div class="form-row">
                <div class="form-group col">
                    <label for="userID">User ID</label>
                    <input type="text" id="userID" name="userID" value="{{ user.userID }}" readonly />
                </div>
                <div class="form-group col">
                    <label for="password">Password</label>
                    <input type="text" id="password" name="password" value="{{ user.password }}" required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" value="{{ user.name }}" required />
                </div>
                <div class="form-group col">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="profile">Profile</label>
                    <select id="profile" name="profile" required>
                        <option value="User Admin" {% if user.profile == "User Admin" %}selected{% endif %}>User Admin</option>
                        <option value="CSR Respresentative" {% if user.profile == "CSR Respresentative" %}selected{% endif %}>CSR Representative</option>
                        <option value="Person In Need" {% if user.profile == "Person In Need" %}selected{% endif %}>Person In Need</option>
                        <option value="Platform Management" {% if user.profile == "Platform Management" %}selected{% endif %}>Platform Management</option>
                    </select>
                </div>
                <div class="form-group col">
                    <label for="userState">User State</label>
                    <select id="userState" name="userState" disabled>
                        <option value="Active" {% if user.userState == "Active" %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if user.userState == "Inactive" %}selected{% endif %}>Inactive</option>
                    </select>
                    <input type="hidden" name="userState" value="{{ user.userState }}">
                </div>
            </div>

            <button class="btn-custom-primary" type="submit">Update User</button>
        </form>
    </div>

    <div class="link-container">
        <a href="{{ url_for('listUsers') }}">← Back to All Users</a><br>
        <a href="/adminHome">Main Page</a>
    </div>
</body>
</html>
