<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Registration</title>

    <!-- Bootstrap 4 -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    />

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
        }

        .form-message {
            margin-bottom: 1rem;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        input.form-control, select.form-control {
            margin-bottom: 1rem;
        }

        .btn-container .btn {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card register-card p-4">
        <h1 class="h4 text-center mb-4">Create User Account</h1>

        {% if message %}
            <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
                <p>{{ message }}</p>
            </div>
        {% endif %}

        <form action="/createUserAcct" method="POST">
            <div class="form-row">
                <div class="form-group col">
                    <label for="userID">User ID</label>
                    <input type="text" id="userID" name="userID" class="form-control" required>
                </div>
                <div class="form-group col">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="form-group col">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="profile">Profile</label>
                    <select id="profile" name="profile" class="form-control" required>
                        <option value="User Admin">User Admin</option>
                        <option value="CSR Respresentative">CSR Respresentative</option>
                        <option value="Person In Need">Person In Need</option>
                        <option value="Platform Management">Platform Management</option>
                    </select>
                </div>
                <div class="form-group col">
                    <label for="userState">User State</label>
                    <select id="userState" name="userState" class="form-control" required>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="btn-container">
                <button type="submit" class="btn btn-outline-success btn-block">Register</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="/listUsers" class="btn btn-link">View All Users</a>
        </div>
        <div class="text-center mt-1">
            <a href="/adminHome" class="btn btn-link">Main Page</a>
        </div>
    </div>
</body>
</html>
