<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User Account Suspend</title>
        <link rel="stylesheet" href="../static/style.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <h2>Suspend User Account</h2>

        {% if message %}
        <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
            <p>{{ message }}</p>
        </div>
        {% endif %}

        <form action="{{ url_for('suspendAcct', userID=user.userID) }}" method="POST" class="suspend-user-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="userID">User ID</label>
                    <input 
                        type="text" 
                        id="userID" 
                        name="userID" 
                        value="{{ user.userID }}" 
                        readonly
                    />
                </div>
                <div class="form-group">
                    <label for="userState">User State</label>
                    <select id="userState" name="userState">
                        <option value="Active" {% if user.userState == "Active" %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if user.userState == "Inactive" %}selected{% endif %}>Inactive</option>
                    </select>

                    <!-- Hidden field to actually submit the current state -->
                    <input type="hidden" name="userState" value="{{ user.userState }}">
                </div>
            </div>

            <button class="btn btn-primary" type="submit">Update User</button>
        </form>

        <div class="link">
            <a href="{{ url_for('listUsers') }}">View All Users</a>
        </div>
        <div class="link">
            <a href="/admin_main">Main Page</a>
        </div>
    </body>
</html>
