<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Category</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            color: #333;
            margin-top: 40px;
            text-align: center;
        }

        .update-card {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 600px;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 5px;
            font-size: 14px;
        }

        textarea {
            resize: none;
        }

        .btn-custom-primary {
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: block;
            margin: 20px auto 0 auto;
            min-width: 200px;
        }

        .btn-custom-primary:hover {
            background-color: #0056b3;
            color: white;
        }

        .form-message {
            margin-bottom: 1rem;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .link-container {
            margin-top: 20px;
            text-align: center;
        }

        .link-container a {
            display: inline-block;
            margin: 5px 0;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .link-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>Update Category</h2>

    {% if message %}
    <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
        <p>{{ message }}</p>
    </div>
    {% endif %}

    <div class="update-card">
        <form action="{{ url_for('updateCategory', category=category.category) }}" method="POST">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="category">Category Name</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ category.category }}"
                        readonly
                    />
                </div>

                <div class="form-group col-md-12">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        required
                    >{{ category.description }}</textarea>
                </div>
            </div>

            <button class="btn-custom-primary" type="submit">Update Category</button>
        </form>
    </div>

    <div class="link-container">
        <a href="{{ url_for('listCategory') }}">← Back to All Categories</a><br>
        <a href="/PMHome">Main Page</a>
    </div>
</body>
</html>
