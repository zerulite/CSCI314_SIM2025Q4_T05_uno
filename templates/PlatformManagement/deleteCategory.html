<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Category</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-top: 40px;
            text-align: center;
        }

        .delete-card {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 600px;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, textarea {
            padding: 10px 12px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            font-size: 16px;
        }

        input[readonly], textarea[readonly] {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        .delete-warning {
            color: #b30000;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }

        .btn-custom-danger {
            background-color: #dc3545;
            color: white;
            border-radius: 5px;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            width: 200px;
            margin: 10px 5px;
        }

        .btn-custom-danger:hover {
            background-color: #b02a37;
            color: white;
        }

        .btn-custom-secondary {
            background-color: #6c757d;
            color: white;
            border-radius: 5px;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            width: 200px;
            margin: 10px 5px;
        }

        .btn-custom-secondary:hover {
            background-color: #5a6268;
            color: white;
        }

        .link-container {
            margin-top: 20px;
            text-align: center;
        }

        .link-container a {
            display: inline-block;
            margin: 5px 0;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .link-container a:hover {
            text-decoration: underline;
        }

        .form-message {
            margin-bottom: 1rem;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Delete Category</h1>

    {% if category %}
        <div class="delete-card">
            {% if message %}
            <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
                <p>{{ message }}</p>
            </div>
            {% endif %}

            <!-- <form action="{{ url_for('deleteCategory', category=category.category) }}" method="POST"> -->
            <form action="{{ url_for('deleteCategory') }}" method="POST">
                <input type="hidden" name="category" value="{{ category.category }}">
                <div class="form-group">
                    <label for="category">Category Name</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ category.category }}"
                        readonly
                    />
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        readonly
                        disabled
                    >{{ category.description }}</textarea>
                </div>

                <p class="delete-warning">
                    Are you sure you want to permanently delete this category?
                </p>

                <div style="text-align:center; margin-top:20px;">
                    <button class="btn-custom-danger" type="submit">Delete Category</button>
                    <a href="{{ url_for('listCategory') }}" class="btn-custom-secondary">Cancel</a>
                </div>
            </form>
        </div>
    {% else %}
        <p class="not-found">Category not found.</p>
    {% endif %}

    <div class="link-container">
        <a href="/PMHome">Main Page</a>
    </div>
</body>
</html>
