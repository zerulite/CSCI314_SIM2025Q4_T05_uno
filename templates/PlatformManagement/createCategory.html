<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Category</title>

    <!-- Bootstrap 4 -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    />

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        .category-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .form-message {
            margin-bottom: 1rem;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
        }

        input.form-control {
            margin-bottom: 1rem;
        }

        .btn-container .btn {
            margin-bottom: 1rem;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card category-card p-4">
        <h1 class="h4 text-center mb-4">Create Category</h1>

        {% if message %}
            <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
                <p>{{ message }}</p>
            </div>
        {% endif %}

        <form action="/createCategory" method="POST">
            <div class="form-group">
                <label for="category">Category Name</label>
                <input type="text" id="category" name="category" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" class="form-control" required>
            </div>

            <div class="btn-container">
                <button type="submit" class="btn btn-outline-success btn-block">Create Category</button>
            </div>
        </form>

        <div class="text-center mt-3">
            <a href="/listCategories" class="btn btn-link">View All Categories</a>
        </div>
        <div class="text-center mt-1">
            <a href="/PMHome" class="btn btn-link">Main Page</a>
        </div>
    </div>
</body>
</html>
