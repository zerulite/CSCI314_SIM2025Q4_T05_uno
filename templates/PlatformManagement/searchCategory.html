<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Categories</title>

  <!-- Bootstrap 4 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
    crossorigin="anonymous"
  />

  <style>
    .filter .form-control { min-width: 140px; }
    .filter label { margin-bottom: .25rem; font-size: .9rem; }
    .table-wrap { width: 100%; }
    .table thead th, .table tbody td { padding: .85rem 1rem; font-size: 14.5px; }
    .btn-toolbar .btn { margin-right: 0.25rem; margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <div class="container my-4">
    <h1 class="mt-3 mb-4 text-center">Search Categories</h1>

    <div class="card shadow-sm">
      <div class="card-body">

        <!-- Search Form -->
        <form method="POST" action="{{ url_for('searchCategory') }}" class="mb-2">
          <div class="d-flex flex-nowrap align-items-end overflow-auto filter flex-wrap">

            <div class="form-group mr-2 mb-2">
              <label for="category">Category Name</label>
              <input type="text" id="category" name="category" class="form-control form-control-sm" placeholder="Category Name" value="{{ category or '' }}">
            </div>

            <div class="form-group mr-2 mb-2 flex-grow-1">
              <label for="description">Description</label>
              <input type="text" id="description" name="description" class="form-control form-control-sm" placeholder="Description" value="{{ description or '' }}">
            </div>

          </div>

          <div class="d-flex justify-content-end mt-2 btn-toolbar flex-wrap">
            <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('listCategory') }}">View All Categories</a>
            <a class="btn btn-outline-secondary btn-sm" href="/PMHome">Main Page</a>
            <button type="submit" class="btn btn-primary btn-sm">Search</button>
          </div>
        </form>

        <!-- Search Results Table -->
        {% if categories %}
        <div class="table-responsive mt-3 table-wrap">
          <table class="table table-striped table-bordered mb-0">
            <thead class="thead-light">
              <tr>
                <th>Category</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {% for cat in categories %}
                <tr>
                  <td>{{ cat.category }}</td>
                  <td>{{ cat.description }}</td>
                    <td>
                    <form action="{{ url_for('viewCategory') }}" method="POST" style="display:inline;">
                        <input type="hidden" name="category" value="{{ cat.category }}">
                        <button type="submit" class="btn btn-sm btn-outline-primary">View</button>
                    </form>

                    <form action="{{ url_for('updateCategory', category=cat.category) }}" method="POST" style="display:inline;">
                        <input type="hidden" name="category" value="{{ cat.category }}">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Edit</button>
                    </form>

                    <form action="{{ url_for('deleteCategory') }}" method="POST" style="display:inline;">
                        <input type="hidden" name="category" value="{{ cat.category }}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                    </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
        {% elif no_results %}
          <div class="mt-3 text-center text-muted">No categories found.</div>
        {% endif %}

      </div>
    </div>
  </div>
</body>
</html>
