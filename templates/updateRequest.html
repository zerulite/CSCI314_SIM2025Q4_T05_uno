<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update Help Request</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
        <style>
            h1 {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="mt-5">Update Help Request</h1>
            <form method="POST" action="/UpdateReq">
                <input type="hidden" name="requestID" value="{{ requestID }}">
                <input type="hidden" name="reqStatus" value="{{ reqStatus }}">
                
                <div class="form-group category-group">
                    <label for="title">Category</label>
                    <select
                        class="form-control"
                        id="category"
                        name="category"
                        required
                    >
                        <option value="" disabled selected>
                            Select a category
                        </option>
                        {%for category in categoryList%}
                        <option value="{{category}}">{{category}}</option>
                        {%endfor%}
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">Description</label>
                    <textarea
                        class="form-control"
                        id="reqDescription"
                        name="reqDescription"
                        rows="4"
                        placeholder="Describe your help request..."
                        required
                    ></textarea>
                </div>
                <div class="form-group">
                    <label for="location">Date when help needed</label>
                    <input
                        type="date"
                        class="form-control"
                        id="helpNeededDate"
                        name="helpNeededDate"
                        placeholder="Enter date"
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="location">Time when help needed</label>
                    <input
                        type="time"
                        class="form-control"
                        id="helpNeededTime"
                        name="helpNeededTime"
                        required
                    />
                </div>
                <a class="btn btn-danger float-left" href="/ViewReq">
                    Cancel Request
                </a>
                <button type="submit" class="btn btn-primary float-right">
                    Update Request
                </button>
            </form>
        </div>
    </body>
</html>
