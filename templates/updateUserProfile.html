<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update User Profile</title>
        <link rel="stylesheet" href="../static/style.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <h2>Update User Profile</h2>

        {% if message %}
        <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
            <p>{{ message }}</p>
        </div>
        {% endif %}

        <form action="{{ url_for('updateProfile', profile=profile.profile) }}" method="POST" class="update-user-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="profile">Profile</label>
                    <select id="profile" name="profile" required>
                        <option value="User Admin" {% if profile.profile == "User Admin" %}selected{% endif %}>User Admin</option>
                        <option value="CSR Representative" {% if profile.profile == "CSR Representative" %}selected{% endif %}>CSR Representative</option>
                        <option value="Person In Need" {% if profile.profile == "Person In Need" %}selected{% endif %}>Person In Need</option>
                        <option value="Platform Management" {% if profile.profile == "Platform Management" %}selected{% endif %}>Platform Management</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="profileState">State</label>
                    <select id="profileState" name="profileState" disabled>
                        <option value="Active" {% if profile.profileState == "Active" %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if profile.profileState == "Inactive" %}selected{% endif %}>Inactive</option>
                    </select>
                    <input type="hidden" name="profileState" value="{{ profile.profileState }}" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="width: 100%;">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        required
                    >{{ profile.description }}</textarea>
                </div>
            </div>

            <button class="btn btn-primary" type="submit">Update Profile</button>
        </form>

        <div class="link">
            <a href="{{ url_for('listProfiles') }}">View All Profiles</a>
        </div>
        <div class="link">
            <a href="/admin_main">Main Page</a>
        </div>
    </body>
</html>
