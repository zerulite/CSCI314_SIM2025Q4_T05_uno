<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Categories</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-top: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-top: 30px;
            text-align: center;
        }

        .search-form {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .results-container {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 800px;
            margin-top: 30px;
            margin-bottom: 40px;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #fff;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }

        th {
            background-color: #007bff;
            color: white;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        .action-cell {
            text-align: center;
            white-space: nowrap;
        }

        .action-cell button {
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
            margin: 0;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }

        .link {
            margin-top: 10px;
        }

        @media (max-width: 700px) {
            .search-form {
                width: 95%;
            }
            
            .form-row {
                flex-direction: column;
            }
            
            .results-container {
                width: 95%;
                padding: 15px;
            }
            
            th, td {
                padding: 8px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>Search Categories</h1>

    <div class="search-form">
        <form method="POST" action="{{ url_for('searchCategory') }}">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="category" placeholder="Category Name">
                </div>
                <div class="form-group">
                    <input type="text" name="description" placeholder="Description">
                </div>
            </div>
            <button type="submit">Search</button>
        </form>
    </div>

    {% if categories %}
    <div class="results-container">
        <h2>Search Results</h2>
        <table>
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Description</th>
                    <th class="action-cell">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <td>{{ cat.category }}</td>
                    <td>{{ cat.description }}</td>
                    <td class="action-cell">
                        <form action="{{ url_for('viewCategory') }}" method="POST" style="display:inline;">
                            <input type="hidden" name="category" value="{{ cat.category }}">
                            <button type="submit">View</button>
                        </form>
                        <form action="{{ url_for('deleteCategory') }}" method="POST" style="display:inline;">
                            <input type="hidden" name="category" value="{{ cat.category }}">
                            <button type="submit" style="background-color: #dc3545;">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="link">
        <a href="{{ url_for('listCategory') }}">View All Categories</a>
    </div>
    <div class="link">
        <a href="/PM_main">Main Page</a>
    </div>

    {% elif no_results %}
    <div class="results-container no-results">
        No categories found.
    </div>
    {% endif %}
</body>
</html>
