<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-top: 40px;
            text-align: center;
        }

        .user-details {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 600px;
            margin-top: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        strong {
            display: inline-block;
            width: 100px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            min-width: 120px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back-link {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #007bff;
            text-decoration: none;
            transition: 0.2s;
        }

        a:hover {
            text-decoration: underline;
        }

        .not-found {
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <h1>User Details</h1>

    {% if user %}
        <div class="user-details">
            <ul>
                <li><strong>User ID:</strong> {{ user['userID'] }}</li>
                <li><strong>Name:</strong> {{ user['name'] }}</li>
                <li><strong>Email:</strong> {{ user['email'] }}</li>
                <li><strong>Profile:</strong> {{ user['profile'] }}</li>
                <li><strong>Status:</strong> {{ user['userState'] }}</li>
            </ul>

            <div class="button-container">
                <!-- Update button -->
                <form action="{{ url_for('updateAcct', userID=user['userID']) }}" method="GET">
                    <button type="submit">Update User</button>
                </form>
                
                <!-- Suspend button -->
                <form action="{{ url_for('suspendAcct', userID=user['userID']) }}" method="GET">
                    <button type="submit">Suspend User</button>
                </form>
            </div>
        </div>
    {% else %}
        <p class="not-found">User not found.</p>
    {% endif %}

    <div class="back-link">
        <a href="{{ url_for('listUsers') }}">← Back to All Users</a>
    </div>
    <div class="link">
        <a href="/admin_main">Main Page</a>
    </div>
</body>
</html>
