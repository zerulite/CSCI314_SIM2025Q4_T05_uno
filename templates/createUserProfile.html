<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            color: #333;
            margin-top: 40px;
            text-align: center;
        }

        .register-form {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 600px;
            margin-top: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: auto;
            display: block;
            margin: 20px auto 0;
        }

        button:hover {
            background-color: #0056b3;
        }

        .link {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #007bff;
            text-decoration: none;
            transition: 0.2s;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .form-message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 700px) {
            .register-form {
                width: 90%;
            }
            
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h2>Create User Profile</h2>

    {% if message %}
        <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
            <p>{{ message }}</p>
        </div>
    {% endif %}

    <form action="/createUserProfile" method="POST" class="register-form">
        <div class="form-row">
            <div class="form-group">
                <label for="profile">Profile</label>
                <input type="text" id="profile" name="profile" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" required>
            </div>

            <div class="form-group">
                <label for="profileState">Profile State</label>
                <select id="profileState" name="profileState" required>
                    <option value="" disabled selected>Select a state</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
        </div>

        <button type="submit">Create</button>
    </form>

    <div class="link">
        <a href="/listProfile">View All Profile</a>
    </div>
    <div class="link">
        <a href="/admin_main">Main Page</a>
    </div>
</body>
</html>
