<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Completed Requests</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
        <style>
            .title-header {
                font-size: 1.5rem;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <h1 class="container mt-5 text-center">Completed Requests</h1>
        <div class="container text-center">
            <div class="row mt-5">
                <div class="col title-header">Service</div>
                <div class="col title-header">Date Completed</div>
            </div>
            {% for req in requests %}
            <div class="row mt-3">
                <div class="col">{{ req.description }}</div>
                <div class="col">{{ req.date_completed }}</div>
        </div>
    </body>
</html>
