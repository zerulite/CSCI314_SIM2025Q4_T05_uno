<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-top: 40px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-top: 20px;
            text-align: center;
        }

        section {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 800px;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .link {
            margin-top: 30px;
            text-align: center;
        }

        a {
            color: #007bff;
            text-decoration: none;
            transition: 0.2s;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid #007bff;
            border-radius: 5px;
            display: inline-block;
        }

        a:hover {
            background-color: #007bff;
            color: white;
            text-decoration: none;
        }

        .no-categories {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }

        .action-cell {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Category Management</h1>

    <section>
        <h2>All Categories</h2>
        {% if categories and categories|length > 0 %}
            <table>
                <thead>
                    <tr>
                        <th>Category Name</th>
                        <th>Description</th>
                        <th class="action-cell">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cat in categories %}
                    <tr>
                        <td>{{ cat['category'] }}</td>
                        <td>{{ cat['description'] }}</td>
                        <td class="action-cell">
                            <form action="{{ url_for('viewCategory') }}" method="POST" style="display:inline;">
                                <input type="hidden" name="category" value="{{ cat['category'] }}">
                                <button type="submit">View Category</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p class="no-categories">No categories found in the system.</p>
        {% endif %}
    </section>
    
    <div class="link">
        <a href="/PM_main">Main Page</a>
    </div>
</body>
</html>
