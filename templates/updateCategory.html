<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Category</title>
    <link rel="stylesheet" href="../static/style.css" />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    />
</head>
<body>
    <h2>Update Category</h2>

    {% if message %}
    <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
        <p>{{ message }}</p>
    </div>
    {% endif %}

    <form action="{{ url_for('updateCategory', category=category.category) }}" method="POST" class="update-user-form">
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="category">Category Name</label>
                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ category.category }}"
                    readonly
                    class="form-control"
                />
            </div>

            <div class="form-group col-md-12">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    class="form-control"
                    required
                >{{ category.description }}</textarea>
            </div>
        </div>

        <button class="btn btn-primary" type="submit">Update Category</button>
    </form>

    <div class="link mt-3">
        <a href="{{ url_for('listCategory') }}">View All Categories</a>
    </div>
    <div class="link mt-2">
        <a href="/PM_main">Main Page</a>
    </div>
</body>
</html>
