<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-top: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-top: 30px;
            text-align: center;
        }

        .search-form {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .results-container {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
            margin-bottom: 40px;
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #fff;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }

        th {
            background-color: #007bff;
            color: white;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        .action-cell {
            text-align: center;
            white-space: nowrap;
        }

        .action-cell button {
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
            margin: 0;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: #666;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .search-form {
                width: 95%;
            }
            
            .form-row {
                flex-direction: column;
            }
            
            .results-container {
                width: 95%;
                padding: 15px;
            }
            
            th, td {
                padding: 8px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>Search User Accounts</h1>

    <div class="search-form">
        <form method="POST" action="{{ url_for('searchUsers') }}">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="userID" placeholder="User ID">
                </div>
                <div class="form-group">
                    <input type="text" name="password" placeholder="Password">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Name">
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <select name="profile">
                        <option value="">--Select Profile--</option>
                        <option value="User Admin"> User Admin</option>
                        <option value="CSR Respresentative">CSR Respresentative</option>
                        <option value="Person In Need">Person In Need</option>
                        <option value="Platform Management">Platform Management</option>
                    </select>
                </div>
                <div class="form-group">
                    <select name="userState">
                        <option value="">--Select State--</option>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>
            
            <button type="submit">Search</button>
        </form>
    </div>

    {% if users %}
    <div class="results-container">
        <h2>Search Results</h2>
        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Password</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Profile</th>
                    <th>User State</th>
                    <th class="action-cell">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.userID }}</td>
                    <td>{{ user.password }}</td>
                    <td>{{ user.name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.profile }}</td>
                    <td>{{ user.userState }}</td>
                    <td class="action-cell">
                        <form action="{{ url_for('viewUserAcct') }}" method="POST" style="display:inline;">
                            <input type="hidden" name="userID" value="{{ user.userID }}">
                            <button type="submit">View Details</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="link">
        <a href="{{ url_for('listUsers') }}">View All Users</a>
    </div>
    <div class="link">
        <a href="/admin_main">Main Page</a>
    </div>
    {% endif %}
</body>
</html>
