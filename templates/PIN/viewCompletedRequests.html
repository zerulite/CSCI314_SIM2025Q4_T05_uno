<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Completed Requests</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
        <style>
            .title-header {
                font-size: 1.5rem;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="btn-container mt-2">
                        <a href="{{url_for('PINHome')}}" class="btn btn-primary float-right"
                            >Back to Home</a
                        >
                    </div>
            <h1 class="container mt-5 text-center">Completed Requests</h1>
            
            {%if result=="Failed to view request: User does not have any completed requests."%}
            <h3 class="container error text-center">No completed requests!</div>
            {%else%}
            <table class="table mt-2">
                
                    <thead>
                        <tr>
                            <th scope="col">Request Description</th>
                            <th scope="col">Date</th>
                            <th scope="col">Time</th>
                            <th scope="col">Category</th>
                            <th scope="col">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {%for row in result%}
                        <tr>
                            <td>{{row[1]}}</td>
                            <td>{{row[2]}}</td>
                            <td>{{row[3]}}</td>
                            <td>{{row[7]}}</td>
                            <td>{{row[4]}}</td>
                        </tr>
                        {%endfor%}
                    </tbody>
                </table>
                {%endif%}
        </div>
    </body>
</html>
