<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>View Request</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
        <style>
            h1 {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="btn-container mt-2">
            <a href="{{url_for('PINHome')}}" class="btn btn-primary float-right"
                >Back to Home</a
            >
        </div>

        <div class="container">
            <h1 class="mt-5">View Request</h1>
        </div>
        {%for r in result%}
        <div class="container d-flex flex-column align-items-center">
            <table class="table table-bordered w-75 mt-3">
                <tbody>
                    <tr>
                        <th class="font-weight-bold" style="width: 40%">
                            Request ID:
                        </th>
                        <td>{{ r[0] }}</td>
                    </tr>
                    <tr>
                        <th class="font-weight-bold">Description:</th>
                        <td>{{ r[1] }}</td>
                    </tr>
                    <tr>
                        <th class="font-weight-bold">Date:</th>
                        <td>{{ r[2] }}</td>
                    </tr>
                    <tr>
                        <th class="font-weight-bold">Time:</th>
                        <td>{{ r[3] }}</td>
                    </tr>
                    <tr>
                        <th class="font-weight-bold">Status:</th>
                        <td>{{ r[4] }}</td>
                    </tr>
                    <tr>
                        <th class="font-weight-bold">View Count:</th>
                        <td>{{ r[5] }}</td>
                    </tr>
                    <tr>
                        <th class="font-weight-bold">Shortlist Count:</th>
                        <td>{{ r[6] }}</td>
                    </tr>
                    <tr>
                        <th class="font-weight-bold">Category:</th>
                        <td>{{ r[7] }}</td>
                    </tr>
                </tbody>
            </table>
            <div class="row mt-3">
                <a href="/PIN/ViewReq" class="btn btn-primary"
                    >Return to View Requests</a
                >
            </div>
        </div>
        {%endfor%}
    </body>
</html>
