<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Account Management</title>
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" 
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" 
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../static/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            background-color: #f8f9fa;
            position: relative;
            min-height: 100vh;
        }

        /* Navbar container for logout */
        .top-right {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }

        h1 {
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <!-- Top-right logout -->
    <div class="top-right">
        <a href="{{ url_for('userLogout') }}" class="btn btn-danger">Logout</a>
    </div>

    <h1>User Account Management</h1>

    <div class="btn-container">
        <a href="{{ url_for('createUserAcct') }}" class="btn btn-success btn-lg btn-block">Create User</a>
        <a href="{{ url_for('searchUsers') }}" class="btn btn-info btn-lg btn-block">Search User</a>
        <a href="{{ url_for('listUsers') }}" class="btn btn-secondary btn-lg btn-block">View All Users</a>
        <a href="{{ url_for('createProfile') }}" class="btn btn-secondary btn-lg btn-block">Create Profile</a>
        <a href="{{ url_for('searchProfile') }}" class="btn btn-secondary btn-lg btn-block">Search Profile</a>
        <a href="{{ url_for('listProfiles') }}" class="btn btn-secondary btn-lg btn-block">View all Profiles</a>
    </div>
</body>
</html>
