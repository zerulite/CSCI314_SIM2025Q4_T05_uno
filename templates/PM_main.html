<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management</title>
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" 
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" 
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../static/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            background-color: #f8f9fa;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }
        h1 {
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <h1>Category Management</h1>

    <div class="btn-container">
        <a href="{{ url_for('createCategory') }}" class="btn btn-success btn-lg btn-block">Create Category</a>
        <a href="{{ url_for('searchCategory') }}" class="btn btn-info btn-lg btn-block">Search Category</a>
        <a href="{{ url_for('listCategory') }}" class="btn btn-secondary btn-lg btn-block">View All Categories</a>
    </div>
</body>
</html>
