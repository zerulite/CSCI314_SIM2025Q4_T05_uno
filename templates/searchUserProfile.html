<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Profiles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2 { color: #333; text-align: center; }

        .search-form, .results-container {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
        }

        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; display: flex; flex-direction: column; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        button:hover { background-color: #0056b3; }

        .results-container { width: 90%; max-width: 1000px; margin-top: 30px; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; background-color: #fff; margin-top: 10px; }
        th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; position: sticky; top: 0; }
        tr:hover { background-color: #f2f2f2; }

        @media (max-width: 700px) {
            .form-row { flex-direction: column; }
            .results-container { width: 95%; padding: 15px; }
        }

        .link { margin-top: 15px; }
        .link a { color: #007bff; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Search Profiles</h1>

    <div class="search-form">
        <form method="POST" action="{{ url_for('searchProfile') }}">
            <div class="form-row">
                <div class="form-group">
                    <select name="profile">
                        <option value="">--Select Profile--</option>
                        <option value="User Admin"> User Admin</option>
                        <option value="CSR Respresentative">CSR Respresentative</option>
                        <option value="Person In Need">Person In Need</option>
                        <option value="Platform Management">Platform Management</option>
                    </select>
                </div>
                <div class="form-group">
                    <select name="profileState">
                        <option value="">--Select State--</option>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="width: 100%;">
                    <textarea name="description" rows="3" placeholder="Enter description"></textarea>
                </div>
            </div>

            <button type="submit">Search</button>
        </form>
    </div>

    {% if profiles %}
    <div class="results-container">
        <h2>Search Results</h2>
        <table>
            <thead>
                <tr>
                    <th>Profile</th>
                    <th>Description</th>
                    <th>Profile State</th>
                    <th class="action-cell">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for profile in profiles %}
                <tr>
                    <td>{{ profile.profile }}</td>
                    <td>{{ profile.description }}</td>
                    <td>{{ profile.profileState }}</td>
                    <td class="action-cell">
                        <form action="{{ url_for('viewProfile') }}" method="POST" style="display:inline;">
                            <input type="hidden" name="profile" value="{{ profile.profile}}">
                            <button type="submit">View Details</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="link">
        <a href="{{ url_for('listProfiles') }}">View All Profiles</a>
    </div>
    <div class="link">
        <a href="/admin_main">Main Page</a>
    </div>
    {% endif %}
</body>
</html>
