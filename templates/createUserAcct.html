<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            color: #333;
            margin-top: 40px;
            text-align: center;
        }

        .register-form {
            background: #fff;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            width: 600px;
            margin-top: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            width: auto;
            display: block;
            margin: 20px auto 0;
        }

        button:hover {
            background-color: #0056b3;
        }

        .link {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #007bff;
            text-decoration: none;
            transition: 0.2s;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .form-message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 700px) {
            .register-form {
                width: 90%;
            }
            
            .form-row {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="../static/style.css">
        <style>
        .form-message {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .form-message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .form-message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .register-form {
            max-width: 600px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

    </style>
</head>
<body>
    <h2>Create User Account</h2>
    {% if message %}
        <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
            <p>{{ message }}</p>
        </div>
    {% endif %}

    <form action="/createUserAcct" method="POST" class="register-form">
        <div class="form-row">
            <div class="form-group">
                <label for="userID">User ID</label>
                <input type="text" id="userID" name="userID" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="profile">Profile</label>
                <select id="profile" name="profile" required>
                    <option value="User Admin">User Admin</option>
                    <option value="CSR Respresentative">CSR Respresentative</option>
                    <option value="Person In Need">Person In Need</option>
                    <option value="Platform Management">Platform Management</option>
                </select>
            </div>
            <div class="form-group">
                <label for="userState">User State</label>
                <select id="userState" name="userState" required>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="link">
        <a href="/listUsers">View All Users</a>
    </div>
    <div class="link">
        <a href="/admin_main">Main Page</a>
    </div>
</body>
</html>
