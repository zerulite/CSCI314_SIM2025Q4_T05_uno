<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>View Request</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
            integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
            crossorigin="anonymous"
        />
        <style>
            h1 {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="mt-5">View Requests</h1>
            <a href="/ViewCreateRequestPg" class="btn btn-primary">Create Request</a>
        </div>
        
        <div class="container">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Request Description</th>
                        <th scope="col">Date</th>
                        <th scope="col">Time</th>
                        <th scope="col">Category</th>
                    </tr>
                </thead>
                <tbody>
                    {%for result in results%}
                    <tr>
                        <td>{{result[1]}}</td>
                        <td>{{result[2]}}</td>
                        <td>{{result[3]}}</td>
                        <td>{{result[7]}}</td>
                        <td>
                            <a class="btn btn-primary">Update Request</a>
                            <form method="POST" action="/DeleteReq" style="display:inline;">
                                <input type="hidden" name="requestID" value="{{ result[0] }}">
                                <button type="submit" class="btn btn-danger">Delete Request</button>
                            </form>
                            
                        </td>
                    </tr>
                    {%endfor%}
                </tbody>
            </table>
            
        </div>
        
    </body>
</html>
