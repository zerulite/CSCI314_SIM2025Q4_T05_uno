<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Category</title>
    <link rel="stylesheet" href="../static/style.css" />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
        crossorigin="anonymous"
    />
    <style>
        .readonly-field {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }
        .delete-warning {
            color: #b30000;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Delete Category</h2>

    {% if message %}
    <div class="form-message {% if 'successfully' in message %}success{% else %}error{% endif %}">
        <p>{{ message }}</p>
    </div>
    {% endif %}

    <form action="{{ url_for('deleteCategory', category=category.category) }}" method="POST" class="update-user-form">
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="category">Category Name</label>
                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ category.category }}"
                    class="form-control readonly-field"
                    readonly
                />
            </div>

            <div class="form-group col-md-12">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    class="form-control readonly-field"
                    readonly
                    disabled
                >{{ category.description }}</textarea>
            </div>
        </div>

        <p class="delete-warning">
            ⚠️ Are you sure you want to permanently delete this category?
        </p>

        <div class="text-center mt-4">
            <button class="btn btn-danger" type="submit">Delete Category</button>
            <a href="{{ url_for('listCategories') }}" class="btn btn-secondary ml-2">Cancel</a>
        </div>
    </form>

    <div class="link mt-4">
        <a href="/admin_main">Main Page</a>
    </div>
</body>
</html>
